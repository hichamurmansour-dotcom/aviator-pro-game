<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي طيران Aviator Pro - مع تأثير ذيل ناري</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="game-container">
    <div id="history" class="history"></div>

    <div class="stats">
        <div>الرصيد: <span id="balance">100.00</span> $</div>
        <button class="btn-reset" onclick="game.resetBalance()">شحن الرصيد</button>
        <div>الأرباح: <span id="profit">0.00</span> $</div>
    </div>

    <div class="screen">
        <canvas id="gameCanvas"></canvas>
        <div id="multiplier" class="multiplier">1.00x</div>
    </div>

    <div class="controls">
        <div class="input-group">
            <label for="betAmount">مبلغ الرهان ($)</label>
            <input type="number" id="betAmount" value="10" min="1">
        </div>

        <div class="input-group">
            <label for="autoCashout">سحب آلي (x)</label>
            <input type="number" id="autoCashout" value="2.00" step="0.1" min="1.01" placeholder="اختياري">
        </div>

        <button id="actionBtn" class="btn-bet" onclick="game.handleAction()">إبدأ الجولة</button>
    </div>

    <div id="log" class="log">أدخل قيمة الرهان واضغط إبدأ الجولة</div>
</div>

<script src="js/particle.js"></script>
<script src="js/audio.js"></script>
<script src="js/renderer.js"></script>
<script src="js/gameState.js"></script>
<script src="js/game.js"></script>
</body>
</html>
